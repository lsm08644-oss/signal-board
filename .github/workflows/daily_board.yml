name: 시그널 보드 매일 갱신

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install yfinance pandas requests

      - name: 보드 생성
        run: |
          mkdir -p docs
          python build_board.py --out docs/index.html --delay 1.0

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --staged --quiet || git commit -m "보드 갱신 $(date +'%Y-%m-%d')"
          git push
